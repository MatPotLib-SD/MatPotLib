[env:arduino_nano_esp32]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
monitor_speed = 115200

; Only main.cpp is compiled. The two reference revisions carry .example so
; they stay out of the build — all three define setup() and loop():
;   mainold_fable.cpp.example  v1, the original MatPotLib firmware
;   mainold_amer.cpp.example   bench firmware that posted to the
;                              smart-plant-api test backend (x-api-key)
; Point this at a different file to build an older revision.
build_src_filter = +<main.cpp>

lib_deps =
  adafruit/Adafruit BME280 Library
  adafruit/Adafruit Unified Sensor
  claws/BH1750
  tzapu/WiFiManager
  bblanchon/ArduinoJson@^7.0.0
