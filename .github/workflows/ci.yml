name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: tabling_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify migration and capture invariants in isolated PostgreSQL
        env:
          PGPASSWORD: isolated-test-only
        run: psql -X -h localhost -U postgres -d tabling_test -v ON_ERROR_STOP=1 -f db/test/tabling.sql
      - name: Verify completion and cancellation races on separate connections
        env:
          PGPASSWORD: isolated-test-only
        run: |
          createdb -h localhost -U postgres tabling_race
          psql -X -h localhost -U postgres -d tabling_race -v ON_ERROR_STOP=1 -v "dblink_connection=host=127.0.0.1 dbname=tabling_race user=postgres password=isolated-test-only" -f db/test/tabling-concurrency.sql

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio
      - name: Use placeholder credentials for compile verification
        run: cp firmware/include/secrets.h.example firmware/include/secrets.h
      - run: pio run -d firmware -e arduino_nano_esp32 -e arduino_nano_esp32_tabling

  simulator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:sim:tabling
