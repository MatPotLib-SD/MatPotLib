name: iOS unsigned .ipa (Sideloadly)

# Builds an unsigned Release .ipa on a GitHub macOS runner. Sideloadly signs
# it with a free Apple ID at install time, so no Apple Developer account or
# EAS credentials are needed. Download the "MatPotLib-ipa" artifact from the
# run page. Push notifications do not work under free Apple ID signing.
#
# Required repository secrets (public client values, also embedded in the app):
#   EXPO_PUBLIC_BACKEND_URL, EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY

on:
  workflow_dispatch:
  push:
    branches: [pres-dev]
    paths:
      - 'app/**'
      - '.github/workflows/ios-sideload.yml'

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    env:
      CI: 1
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci

      - name: Write app config
        env:
          BACKEND_URL: ${{ secrets.EXPO_PUBLIC_BACKEND_URL }}
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$BACKEND_URL" ] || [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing EXPO_PUBLIC_* repository secrets" >&2
            exit 1
          fi
          {
            echo "EXPO_PUBLIC_BACKEND_URL=$BACKEND_URL"
            echo "EXPO_PUBLIC_SUPABASE_URL=$SUPABASE_URL"
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "EXPO_PUBLIC_DEMO_MODE=false"
            echo "EXPO_PUBLIC_TABLING_MODE=false"
          } > .env

      - name: Generate iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Build unsigned Release app
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP"
          test -f "$APP/main.jsbundle"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry MatPotLib-unsigned.ipa Payload
          ls -lh MatPotLib-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: MatPotLib-ipa
          path: app/MatPotLib-unsigned.ipa
          retention-days: 14
